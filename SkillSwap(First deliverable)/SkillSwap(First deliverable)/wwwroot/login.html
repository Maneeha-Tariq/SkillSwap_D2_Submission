<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SkillSwap</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card shadow p-4">
                    <h1 class="fw-bold" >Skill Swap</h1>

                    <p class="lead fw-bold" >Welcome Back!</p>
                    <p class="lead text-secondary mb-4">Login to continue your learning journey.</p>

                    <form method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email">

                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Enter your password">
                        </div>
                        <input type="submit" class=" btn btn-primary w-100" value="Login" />
                    </form>
                   
                </div>
            </div>
        </div>
    </div>

    <footer class="auth-footer text-center mt-4"> 
        Don't have an account?<a href="signup.html">Sign Up</a>
    </footer>
</body>
</html>
